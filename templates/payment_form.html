<!DOCTYPE html>
{% load crispy_forms_tags %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <style>
       
    </style>
</head>
<body class="m-2 bg-light">
    <h2 class="mt-4">Payment for Order {{order.order_id}}</h2>
    <div class="alert alert-info w-50 ms-4">
        <strong>Total Amount:</strong> ₹{{total}}
    </div>
    <form method="post" class="form-control ms-4 p-4 w-50 ">
        {% csrf_token %}
        {{form|crispy}}
        <button type="submit" class="btn btn-primary">Pay ₹{{total}}</button>
    </form>

    
</body>
</html>
