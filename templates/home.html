{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <style>
        body {
            background-image: url("{% static 'images/shop.jpg' %}");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }
        .login{
            margin: 100px auto;
            padding: 50px;
            width: 500px;
            height: 300px;
            
        }

        button{
            background-color: blue;
            color: white;
            padding: 10px;
            border: none;
            margin-left: 130px;
        }
        form{
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
        }

    </style>
</head>



<body >
    <nav class="navbar bg-success">
        <div class="container-fluid">
            <div class="navbar-header">
                <a class="navbar-brand text-white fs-2" href="">ABC SHOP</a>
            </div>
            <ul class="nav fs-5">
                <li class="nav-item"><a class="nav-link active text-white" href="{% url 'user_register' %}">Sign up</a></li>

            </ul>
        </div>
    </nav>
    <main>
        {% if messages %}
            <div class="card w-100 bg-light">
                {% for message in messages %}
                    <p class="text-danger fw-bold m-4 text-center p-2">{{message}}</p>
                {% endfor %}
            </div>
        {% endif %}
        
        <div class="login">
            <form method="post" class="form-control mt-4 p-4">
                {% csrf_token %}
                <label for="username">USERNAME : </label>
                <input type="text" name="username" placeholder="Enter your username" required><br><br>
                <label for="password">PASSWORD : </label>
                <input type="password" name="password" placeholder="Enter your password" required><br><br>
                <button type="submit">LOGIN</button>
            </form>
        </div>
        
    </main>
</body>


</html>
