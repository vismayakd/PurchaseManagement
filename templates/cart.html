<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</head>
<body class="bg-light">
    <a href="{% url 'user_dashboard' %}" class="btn btn-primary m-4">BACK</a>
    <div class="container mt-4">
    
    <h2 class="mb-4">Your Cart</h2>

    
    <div class="row g-3">
        {% if items %}
            {% for item in items %}
            <div class="col-md-2 d-flex">
                <div class="card w-100 h-100 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">{{ item.product.name }}</h5>
                        <p>Quantity: {{ item.quantity }}</p>
                        <p>Price: ₹{{ item.price }}</p>
                        <p><b>Total : ₹{{ item.total }}</b></p>
                    </div>
                    <a href="{% url 'delete_item' item.id %}" class="btn btn-danger">Delete</a>
                </div>
                
            </div>
            {% endfor %}
        {% else %}
            <p>Your cart is empty!</p>
        {% endif %}
       
    </div>

    <div class="mt-4">
        <h4>Total Price: ₹{{ total }}</h4>
        {% if items %}
        <a href="{% url 'place_order' %}" class="btn btn-success w-25 mt-2">Place Order</a>
        {% endif %}
    </div>
</div>

    
</body>
</html>
